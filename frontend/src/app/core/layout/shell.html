<a
  class="saltar-contenido w3-button w3-info"
  href="#contenido"
  (click)="saltarAlContenido($event)"
  >Saltar al contenido principal</a
>

<div class="w3-top w3-bar w3-asphalt w3-hide-large shell-barra">
  <button
    #botonMenu
    type="button"
    class="w3-bar-item w3-button"
    aria-label="Abrir menú"
    aria-controls="menu-principal"
    [attr.aria-expanded]="menuAbierto()"
    (click)="abrirMenu()"
  >
    <span aria-hidden="true">☰</span>
  </button>
  <h4 class="w3-bar-item w3-large" style="margin: 0">Smart RDP</h4>
</div>

@if (menuAbierto()) {
  <button
    type="button"
    class="w3-overlay w3-hide-large"
    tabindex="-1"
    aria-hidden="true"
    [style.display]="'block'"
    (click)="cerrarMenu()"
  ></button>
}

<nav
  id="menu-principal"
  aria-label="Principal"
  class="w3-sidebar w3-bar-block w3-collapse w3-asphalt shell-menu"
  [style.display]="menuAbierto() ? 'flex' : null"
  [cdkTrapFocus]="menuAbierto()"
>
  <div class="shell-menu__header w3-bar-item w3-border w3-border-black">
    <h4 class="w3-large" style="margin: 0">Smart RDP</h4>

    <button
      #botonCerrarMenu
      type="button"
      class="w3-button w3-hide-large w3-right-align"
      (click)="cerrarMenu()"
    >
      Cerrar menú <span aria-hidden="true">✕</span>
    </button>
  </div>

  <div class="shell-menu__nav">
    @for (grupo of grupos(); track grupo.clave) {
      @if (grupo.titulo) {
        <p
          [id]="'grupo-' + grupo.clave"
          class="shell-menu__grupo-titulo"
        >
          {{ grupo.titulo }}
        </p>
      }
      <div role="group" [attr.aria-labelledby]="grupo.titulo ? 'grupo-' + grupo.clave : null">
        @for (item of grupo.items; track item.ruta) {
          <a
            class="w3-bar-item w3-button"
            [routerLink]="item.ruta"
            routerLinkActive="w3-crimson w3-border w3-border-black"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            >{{ item.etiqueta }}</a
          >
        }
      </div>
    }
  </div>

  <div class="shell-menu__pie w3-border-top w3-padding">
    <p class="w3-small">{{ auth.sesion()?.nombre }} · {{ etiquetaRol() }}</p>
    <button type="button" class="w3-button w3-block w3-left-align w3-crimson w3-round" (click)="cerrarSesion()">
      <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Cerrar sesión
    </button>
  </div>
</nav>

<main #main id="contenido" tabindex="-1" class="shell-main">
  <div class="w3-container w3-padding-16 w3-white">
    <router-outlet />
  </div>
  <app-footer />
</main>
