<form
  [formGroup]="nuevoForm"
  (ngSubmit)="agregar()"
  novalidate
  class="w3-section w3-white w3-padding w3-margin w3-card w3-border"
>
  <label for="nuevo-nombre"
    ><b>Nombre de la nueva {{ config.singular }}</b></label
  >
  <input
    id="nuevo-nombre"
    class="w3-input"
    type="text"
    formControlName="nombre"
    maxlength="50"
    autocomplete="off"
    [attr.aria-invalid]="errorNuevo() ? 'true' : null"
    [attr.aria-describedby]="errorNuevo() ? 'error-nuevo' : null"
  />
  @if (errorNuevo(); as m) {
    <p id="error-nuevo" class="texto-error"><i class="fa-solid fa-exclamation" aria-hidden="true"></i> {{ m }}</p>
  }
  <button
    type="submit"
    class="w3-button w3-info w3-margin-top w3-round"
    [attr.aria-disabled]="procesando()"
  >
    <i class="fa fa-plus" aria-hidden="true"></i> Agregar
  </button>
</form>

<app-estado-vista
  [cargando]="items.status() === 'loading'"
  [error]="items.error()"
  [vacio]="lista().length === 0"
  [mensajeCarga]="'Cargando ' + config.titulo.toLowerCase() + '…'"
  [mensajeVacio]="
    'Aún no hay ' + config.titulo.toLowerCase() + '. Agrega la primera con el formulario de arriba.'
  "
  (reintentar)="items.reload()"
>
  <div class="w3-container w3-border w3-margin w3-padding w3-light-grey">
    <div class="w3-responsive">
      <table class="w3-table-all">
        <caption class="visualmente-oculto">
          {{
            config.titulo
          }}
        </caption>
        <thead>
          <tr class="w3-light-grey">
            <th scope="col">Nombre</th>
            <th scope="col">Estado</th>
            <th scope="col"><span class="visualmente-oculto">Acciones</span></th>
          </tr>
        </thead>
        <tbody>
          @for (item of lista(); track item.id) {
            @if (editandoId() === item.id) {
              <tr>
                <td colspan="3">
                  <form [formGroup]="edicionForm" (ngSubmit)="guardarEdicion(item)" novalidate>
                    <label [for]="'editar-' + item.id"
                      ><b>Nuevo nombre de "{{ item.nombre }}"</b></label
                    >
                    <input
                      [id]="'editar-' + item.id"
                      class="w3-input"
                      type="text"
                      formControlName="nombre"
                      maxlength="50"
                      autocomplete="off"
                      (keydown.escape)="cancelarEdicion(item)"
                      [attr.aria-invalid]="errorEdicion() ? 'true' : null"
                      [attr.aria-describedby]="errorEdicion() ? 'error-edicion' : null"
                    />
                    @if (errorEdicion(); as m) {
                      <p id="error-edicion" class="texto-error">
                        <i class="fa-solid fa-exclamation" aria-hidden="true"></i> {{ m }}
                      </p>
                    }
                    <div class="w3-margin-top">
                      <button
                        type="submit"
                        class="w3-button w3-info w3-round"
                        [attr.aria-disabled]="procesando()"
                      >
                        Guardar
                      </button>
                      <button
                        type="button"
                        class="w3-button w3-white w3-border w3-margin-left w3-round"
                        (click)="cancelarEdicion(item)"
                      >
                        Cancelar
                      </button>
                    </div>
                  </form>
                </td>
              </tr>
            } @else {
              <tr>
                <td>
                  <b>{{ item.nombre }}</b>
                </td>
                <td>
                  @if (item.activo) {
                    Activa
                  } @else {
                    <app-estado-badge estado="inactiva" />
                  }
                </td>
                <td>
                  <button
                    type="button"
                    class="w3-button w3-border w3-border-red w3-margin-left w3-round w3-right"
                    [attr.aria-disabled]="procesando()"
                    (click)="alternar(item)"
                  >
                    <i [class]="item.activo ? 'fa fa-ban' : 'fa fa-undo'" aria-hidden="true"></i>
                    {{ item.activo ? 'Desactivar' : 'Reactivar'
                    }}<span class="visualmente-oculto"> {{ item.nombre }}</span>
                  </button>
                  <button
                    [id]="'renombrar-' + item.id"
                    type="button"
                    class="w3-button w3-warning w3-round w3-right"
                    (click)="iniciarEdicion(item)"
                  >
                    <i class="fa fa-pencil" aria-hidden="true"></i> Renombrar<span
                      class="visualmente-oculto"
                    >
                      {{ item.nombre }}</span
                    >
                  </button>
                </td>
              </tr>
            }
          }
        </tbody>
      </table>
    </div>
  </div>
</app-estado-vista>
