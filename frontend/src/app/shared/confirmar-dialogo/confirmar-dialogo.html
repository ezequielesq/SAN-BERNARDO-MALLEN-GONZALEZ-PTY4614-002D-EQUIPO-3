<div class="w3-white w3-padding-large w3-card-4">
  <h2 id="confirmar-dialogo-titulo" class="w3-large">{{ datos.titulo }}</h2>
  <p id="confirmar-dialogo-descripcion">{{ datos.descripcion }}</p>
  <div class="w3-bar">
    <button type="button" class="w3-button w3-crimson w3-margin-right" (click)="cerrar(true)">{{ datos.textoConfirmar }}</button>
    <button id="confirmar-dialogo-cancelar" type="button" class="w3-button w3-white w3-border" (click)="cerrar(false)">Cancelar</button>
  </div>
</div>
