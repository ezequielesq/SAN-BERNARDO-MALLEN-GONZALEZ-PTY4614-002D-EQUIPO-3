<div class="w3-container w3-border w3-margin w3-padding w3-light-grey">
  <label for="alertas-umbral"><b>Avisar con </b></label>
  <select
    #selectUmbral
    id="alertas-umbral"
    class="w3-select"
    style="width: auto; display: inline-block"
    [value]="diasUmbral()"
    (change)="cambiarUmbral(selectUmbral.value)"
  >
    <option value="3">3 días de anticipación</option>
    <option value="7">7 días de anticipación</option>
    <option value="15">15 días de anticipación</option>
    <option value="30">30 días de anticipación</option>
  </select>
</div>

<div class="w3-container w3-border w3-margin w3-light-grey w3-padding">
  <app-estado-vista
    [cargando]="alertas.status() === 'loading'"
    [error]="alertas.error()"
    [vacio]="todos().length === 0"
    mensajeCarga="Cargando alertas…"
    mensajeVacio="No hay lotes por vencer en el rango seleccionado."
    (reintentar)="alertas.reload()"
  >
    <ul class="grilla-tarjetas">
      @for (a of todos(); track a.id) {
        <li>
          <article class="w3-card w3-white w3-border w3-padding">
            <h2 class="w3-medium"><b>{{ a.productoNombre }}</b></h2>
            <p><app-estado-badge estado="pendiente" /></p>
            <p>{{ a.motivo || '—' }}</p>
            <p>{{ a.fecha | date: 'dd-MM-yyyy' }}</p>
          </article>
        </li>
      }
    </ul>
  </app-estado-vista>
</div>
