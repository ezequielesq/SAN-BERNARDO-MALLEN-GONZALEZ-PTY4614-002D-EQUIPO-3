<div class="w3-bar w3-light-grey w3-border" style="display: flex; align-items: center">
  <button
    type="button"
    class="w3-button w3-border w3-white w3-margin w3-round"
    (click)="cambiarMes(-1)"
  >
    <i class="fa fa-chevron-left" aria-hidden="true"></i> Mes anterior
  </button>
  <span class="w3-center" style="flex: 1; font-weight: bold">{{ etiquetaMes() }}</span>
  <button
    type="button"
    class="w3-button w3-border w3-white w3-margin w3-round"
    (click)="cambiarMes(1)"
  >
    Mes siguiente <i class="fa fa-chevron-right" aria-hidden="true"></i>
  </button>
</div>

<div class="w3-white w3-border w3-padding-small">
  @if (vencimientos.status() === 'loading') {
    <p role="status" class="w3-center w3-small w3-text-grey">Cargando…</p>
  }

  <div class="calendario-mes-grilla w3-margin-bottom">
    @for (etiqueta of DIAS_ES; track etiqueta) {
      <div class="w3-center w3-small w3-text-grey" style="font-weight: bold">{{ etiqueta }}</div>
    }
  </div>

  <div class="calendario-mes-grilla">
    @for (dia of diasDelMes(); track $index) {
      @if (dia.tipo === 'vacio') {
        <div></div>
      } @else {
        <button
          type="button"
          class="calendario-mes-dia"
          [class.seleccionado]="diaActivo() === dia.fecha"
          [attr.aria-pressed]="diaActivo() === dia.fecha"
          (click)="seleccionarDia(dia.fecha!)"
        >
          <span class="numero-dia">{{ dia.dia }}</span>
          <span class="puntos-dia">
            @if (resumenPorDia().get(dia.fecha!)?.proximo) {
              <span class="punto punto-proximo" aria-hidden="true"></span>
            }
            @if (resumenPorDia().get(dia.fecha!)?.vencido) {
              <span class="punto punto-vencido" aria-hidden="true"></span>
            }
          </span>
          <span class="visualmente-oculto">
            @if (resumenPorDia().get(dia.fecha!)?.proximo) { con productos próximos a vencer }
            @if (resumenPorDia().get(dia.fecha!)?.vencido) { con productos vencidos }
          </span>
        </button>
      }
    }
  </div>

  <div class="w3-bar w3-small w3-text-grey w3-margin-top w3-border-top w3-padding-small">
    <span class="w3-bar-item"><span class="punto punto-proximo" aria-hidden="true"></span> Próximo a vencer</span>
    <span class="w3-bar-item"><span class="punto punto-vencido" aria-hidden="true"></span> Vencido</span>
  </div>
</div>
