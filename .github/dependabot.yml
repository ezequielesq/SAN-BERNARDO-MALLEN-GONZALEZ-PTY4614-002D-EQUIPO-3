# Revisión semanal de dependencias vulnerables o desactualizadas.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/FASE 2/EVIDENCIAS PROYECTO/EVIDENCIAS DE SISTEMA/APLICACIÓN/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "develop"
  - package-ecosystem: "npm"
    directory: "/FASE 2/EVIDENCIAS PROYECTO/EVIDENCIAS DE SISTEMA/APLICACIÓN/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "develop"
    groups:
      angular:
        patterns:
          - "@angular/*"
    ignore:
      # Angular 22 todavía no es compatible con TypeScript 7 (el compilador falla al iniciar).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
