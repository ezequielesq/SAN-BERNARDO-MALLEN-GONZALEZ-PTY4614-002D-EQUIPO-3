# Integración continua: en cada subida a main o develop (y en cada pull request)
# corre las pruebas de flujo del backend contra un PostgreSQL real y compila el frontend.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  APLICACION: FASE 2/EVIDENCIAS PROYECTO/EVIDENCIAS DE SISTEMA/APLICACIÓN

jobs:
  backend:
    name: Backend (pruebas de flujo)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          # Clave inventada solo para la base efímera de esta corrida; no es un secreto real.
          POSTGRES_PASSWORD: clave-solo-para-ci
          POSTGRES_DB: smartrdp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartrdp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Ejecutar las pruebas
        working-directory: ${{ env.APLICACION }}/backend
        env:
          SMARTRDP_DB_PASSWORD: clave-solo-para-ci
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode test
      - name: Guardar el informe de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: ${{ env.APLICACION }}/backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Frontend (compilación)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Instalar dependencias
        working-directory: ${{ env.APLICACION }}/frontend
        # No usa "npm ci": el package-lock.json se generó en Windows y no trae los binarios de Linux.
        run: npm install
      - name: Compilar
        working-directory: ${{ env.APLICACION }}/frontend
        run: npx ng build --configuration production
