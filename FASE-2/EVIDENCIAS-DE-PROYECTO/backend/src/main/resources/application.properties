spring.application.name=smart-rdp

spring.datasource.url=jdbc:postgresql://localhost:5432/smartrdp
spring.datasource.username=postgres
spring.datasource.password=${SMARTRDP_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

app.jwt.secret=${SMARTRDP_JWT_SECRET}
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:4200

server.port=8080

app.seed.admin-email=${SMARTRDP_ADMIN_EMAIL:}
app.seed.admin-password=${SMARTRDP_ADMIN_PASSWORD:}
