server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El nombre del backend se resuelve en cada petición, así el frontend arranca aunque el backend aún no esté listo.
    # 127.0.0.11 es el DNS interno de Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # La API se sirve bajo el mismo origen que la aplicación: el navegador llama a /api y nginx la reenvía al backend.
    # BACKEND_URL se reemplaza al arrancar el contenedor (plantilla de nginx); por defecto es http://backend:8080.
    location /api/ {
        set $backend ${BACKEND_URL};
        # El backend acepta archivos de hasta 2 MB (importación desde Excel); nginx deja pasar un poco más.
        client_max_body_size 3m;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aplicación de una sola página: cualquier ruta del router vuelve a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
