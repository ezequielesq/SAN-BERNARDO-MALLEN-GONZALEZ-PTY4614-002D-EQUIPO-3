# Perfil de las pruebas de flujo: base dedicada, vacía y recién migrada en cada corrida.
# La contraseña de la base llega por la variable de entorno SMARTRDP_DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/smartrdp_test
spring.datasource.username=postgres
spring.datasource.password=${SMARTRDP_DB_PASSWORD}

# Flyway puede vaciar la base solo en este perfil (ver ConfiguracionBdPruebas).
spring.flyway.clean-disabled=false

# Constantes de prueba inventadas solo para los tests: no son secretos reales.
app.jwt.secret=Y2xhdmUtaW52ZW50YWRhLXNvbG8tcGFyYS1wcnVlYmFzLWRlLWZsdWpvLXNtYXJ0cmRwLTIwMjY=
app.seed.admin-email=admin-pruebas@smartrdp.test
app.seed.admin-password=clave-de-pruebas-123

# Menos ruido en la consola
logging.level.org.hibernate.SQL=off
spring.jpa.properties.hibernate.format_sql=false
